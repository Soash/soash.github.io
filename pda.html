<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Based Isothermal Primer-Dimer Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 1100px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .instructions {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        /* --- Responsive Input Group Layout --- */
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #34495e;
            margin-bottom: 8px;
        }

        input[type=text] {
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type=text]:focus {
            border-color: #3498db;
        }

        /* --- Controls Area --- */
        .controls-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            width: 100%;
        }

        .nav-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease-in-out;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background-color: #2980b9;
        }

        .nav-btn:active {
            background-color: #1f6391;
        }

        .slider-control {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        input[type=range] {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #dcdde1;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            transition: background 0.15s ease-in-out;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            background: #2980b9;
        }

        /* --- Grid Alignment Matrix Styles --- */
        .visualization-scroll-container {
            width: 100%;
            overflow-x: auto;
            background-color: #2c3e50;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .visualization-grid {
            display: grid;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            justify-content: start;
            align-items: center;
            row-gap: 2px;
        }

        .row-label {
            font-size: 13px;
            color: #95a5a6;
            padding-right: 15px;
            white-space: nowrap;
            user-select: none;
        }

        .nt-cell {
            width: 24px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .fp-cell { color: #2ecc71; }
        .match-cell { color: #f1c40f; font-size: 18px; }
        .rp-cell { color: #e74c3c; }

        .terminal-danger-fp { background-color: rgba(231, 76, 60, 0.4); border-radius: 3px; color: #fff; }
        .terminal-danger-rp { background-color: rgba(231, 76, 60, 0.4); border-radius: 3px; color: #fff; }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status-alert {
            grid-column: span 2;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
        }

        .danger { background-color: #fab1a0; color: #d63031; border-left: 5px solid #d63031; }
        .safe { background-color: #55efc4; color: #00b894; border-left: 5px solid #00b894; }

        /* --- Media Query for Mobile/Smaller Screens --- */
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }
            .container {
                padding: 15px;
            }
            .input-group {
                grid-template-columns: 1fr; /* Switch to single column (two stacked rows) */
                gap: 15px;
            }
            .stats {
                grid-template-columns: 1fr; /* Stack stats values vertically as well */
            }
            .status-alert {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Primer-Dimer Analyzer</h2>

    <div class="input-group">
        <div class="input-field">
            <label for="fpInput">Forward Primer (5' &rarr; 3')</label>
            <input type="text" id="fpInput" value="AGAAAGTTACCACAGTTATGCACAGAGCTG">
        </div>
        <div class="input-field">
            <label for="rpInput">Reverse Primer (5' &rarr; 3')</label>
            <input type="text" id="rpInput" value="TTATCACATACAGCATATGGATTCCCATCTC">
        </div>
    </div>

    <div class="controls-container">
        <button class="nav-btn" id="prevBtn">&larr; Prev</button>
        <div class="slider-control">
            <input type="range" id="shiftSlider" min="-30" max="30" value="13">
        </div>
        <button class="nav-btn" id="nextBtn">Next &rarr;</button>
    </div>

    <div class="visualization-scroll-container">
        <div class="visualization-grid" id="visualizationGrid"></div>
    </div>

    <div class="stats">
        <div><strong>Total Overlapping Footprint:</strong> <span id="overlapCount">0</span> bp</div>
        <div><strong>Watson-Crick Hydrogen Bonds (|):</strong> <span id="matchCount">0</span> pairs</div>
        <div id="statusBox" class="status-alert"></div>
    </div>
</div>

<script>
    const fpInput = document.getElementById('fpInput');
    const rpInput = document.getElementById('rpInput');
    const slider = document.getElementById('shiftSlider');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const gridContainer = document.getElementById('visualizationGrid');
    const overlapCount = document.getElementById('overlapCount');
    const matchCount = document.getElementById('matchCount');
    const statusBox = document.getElementById('statusBox');

    function getCleanSequence(inputEl) {
        return inputEl.value.toUpperCase().replace(/[^ATCG]/g, '');
    }

    function calculateSliderBounds() {
        const fpLen = getCleanSequence(fpInput).length;
        const rpLen = getCleanSequence(rpInput).length;
        slider.min = -rpLen;
        slider.max = fpLen;
    }

    // Watson-Crick Complement Verification
    function isWatsonCrickMatch(b1, b2) {
        return (b1 === 'A' && b2 === 'T') || 
               (b1 === 'T' && b2 === 'A') || 
               (b1 === 'C' && b2 === 'G') || 
               (b1 === 'G' && b2 === 'C');
    }

    function updateAlignment() {
        const fp = getCleanSequence(fpInput);
        const rpRaw = getCleanSequence(rpInput);

        if (!fp || !rpRaw) {
            gridContainer.innerHTML = "<span style='color: #e74c3c; padding:20px;'>Error: Missing Sequence Tracks.</span>";
            return;
        }

        const rp_3to5_visual = rpRaw.split('').reverse().join('');
        const shift = parseInt(slider.value);
        
        const minIndex = Math.min(0, shift);
        const maxIndex = Math.max(fp.length, rp_3to5_visual.length + shift);
        const totalColumns = maxIndex - minIndex;

        gridContainer.style.gridTemplateColumns = `max-content repeat(${totalColumns}, 24px)`;

        let currentMatches = 0;
        let currentOverlaps = 0;
        let dangerousFP3Prime = false;
        let dangerousRP3Prime = false;

        const fpCells = [];
        const matchCells = [];
        const rpCells = [];

        for (let i = minIndex; i < maxIndex; i++) {
            let fpChar = "";
            let isFP3PrimeEnd = (i === fp.length - 1);
            if (i >= 0 && i < fp.length) {
                fpChar = fp[i];
            }

            let rpChar = "";
            const rpVisualIndex = i - shift;
            let isRP3PrimeEnd = (rpVisualIndex === 0);
            
            if (rpVisualIndex >= 0 && rpVisualIndex < rp_3to5_visual.length) {
                rpChar = rp_3to5_visual[rpVisualIndex];
            }

            let bondSymbol = "";

            if (fpChar && rpChar) {
                currentOverlaps++;
                if (isWatsonCrickMatch(fpChar, rpChar)) {
                    bondSymbol = "|";
                    currentMatches++;
                    if (isFP3PrimeEnd) dangerousFP3Prime = true;
                    if (isRP3PrimeEnd) dangerousRP3Prime = true;
                }
            }

            fpCells.push({ char: fpChar || " ", is3Prime: isFP3PrimeEnd, activeDanger: false });
            matchCells.push({ char: bondSymbol || " " });
            rpCells.push({ char: rpChar || " ", is3Prime: isRP3PrimeEnd, activeDanger: false });
        }

        if (dangerousFP3Prime) {
            let targetIdx = fpCells.findIndex(c => c.is3Prime === true);
            if(targetIdx !== -1) fpCells[targetIdx].activeDanger = true;
        }
        if (dangerousRP3Prime) {
            let targetIdx = rpCells.findIndex(c => c.is3Prime === true);
            if(targetIdx !== -1) rpCells[targetIdx].activeDanger = true;
        }

        // Row 1: Forward Primer Track
        let gridHTML = `<div class="row-label">FP (5'-3')</div>`;
        fpCells.forEach(cell => {
            const dangerClass = cell.activeDanger ? "terminal-danger-fp" : "";
            gridHTML += `<div class="nt-cell fp-cell ${dangerClass}">${cell.char}</div>`;
        });

        // Row 2: Bonds
        gridHTML += `<div class="row-label"></div>`;
        matchCells.forEach(cell => {
            gridHTML += `<div class="nt-cell match-cell">${cell.char}</div>`;
        });

        // Row 3: Reverse Primer Track
        gridHTML += `<div class="row-label">RP (3'-5')</div>`;
        rpCells.forEach(cell => {
            const dangerClass = cell.activeDanger ? "terminal-danger-rp" : "";
            gridHTML += `<div class="nt-cell rp-cell ${dangerClass}">${cell.char}</div>`;
        });

        gridContainer.innerHTML = gridHTML;

        overlapCount.innerText = currentOverlaps;
        matchCount.innerText = currentMatches;

        if (dangerousFP3Prime && dangerousRP3Prime) {
            statusBox.className = "status-alert danger";
            statusBox.innerText = "CRITICAL: Mutual 3' Extension! Both primers can extend each other simultaneously. Severe false-positives guaranteed.";
        } else if (dangerousFP3Prime) {
            statusBox.className = "status-alert danger";
            statusBox.innerText = "WARNING: Forward Primer 3' Extension site active. Isothermal polymerase will initiate dimer elongation.";
        } else if (dangerousRP3Prime) {
            statusBox.className = "status-alert danger";
            statusBox.innerText = "WARNING: Reverse Primer 3' Extension site active. Isothermal polymerase will initiate dimer elongation.";
        } else {
            statusBox.className = "status-alert safe";
            statusBox.innerText = "Safe alignment: No active 3' terminal extension pairing found at this overlap coordinate.";
        }
    }

    // Button Click Functionality
    prevBtn.addEventListener('click', () => {
        let val = parseInt(slider.value);
        if (val > parseInt(slider.min)) {
            slider.value = val - 1;
            updateAlignment();
        }
    });

    nextBtn.addEventListener('click', () => {
        let val = parseInt(slider.value);
        if (val < parseInt(slider.max)) {
            slider.value = val + 1;
            updateAlignment();
        }
    });

    [fpInput, rpInput].forEach(element => {
        element.addEventListener('input', () => {
            calculateSliderBounds();
            updateAlignment();
        });
    });

    slider.addEventListener('input', updateAlignment);

    window.addEventListener('DOMContentLoaded', () => {
        calculateSliderBounds();
        updateAlignment();
    });
</script>

</body>
</html>
