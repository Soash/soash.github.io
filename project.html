<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Md Abu Sadat Soash — Research Projects</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="src/styles.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar (Desktop) -->
    <div id="sidebar" class="col-md-3 sidebar p-4 d-none d-md-block"></div>

    <!-- Mobile Navbar -->
    <nav class="navbar navbar-dark bg-dark d-md-none sticky-top">
      <div class="container-fluid">
        <!-- Website Title (Left) -->
        <span class="navbar-brand mb-0 h4">Md Abu Sadat Soash</span>

        <!-- Toggle Button (Right) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu" aria-controls="mobileMenu"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <!-- Offcanvas Menu (Narrow width) -->
    <div class="offcanvas offcanvas-start text-bg-dark d-md-none" tabindex="-1" id="mobileMenu" style="width: 250px;">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>

      <div class="offcanvas-body">
        <ul class="navbar-nav" id="mobile-sidebar">
        </ul>
      </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9 main-content p-2 p-md-5">
        
        <section id="projects" class="mb-5">
            <h4 class="section-title mb-4">Research Projects</h4>
            <div id="projectsContainer" class="d-flex flex-column gap-3"></div>
        </section>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="src/scripts.js"></script>
<script>
fetch('projects.json')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('projectsContainer');

    data.forEach((project, index) => {
      const hasAbstract = Boolean(project.abstract);
      const abstractId = `abstract-${index}`;

      const authorHtml = project.authors ? `
        <p class="text-muted mb-2" style="font-size: 0.9em;">
          <strong>Author(s):</strong> ${project.authors}
          ${project.affiliation ? `<br><span class="fst-italic">${project.affiliation}</span>` : ''}
          ${project.email ? ` &bull; <a href="mailto:${project.email}" class="text-decoration-none">${project.email}</a>` : ''}
        </p>
      ` : '';

      const abstractBtn = hasAbstract ? `
        <button class="btn btn-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#${abstractId}" aria-expanded="false" aria-controls="${abstractId}">
          Read Abstract
        </button>
      ` : '';

      const abstractCollapse = hasAbstract ? `
        <div class="collapse mt-3" id="${abstractId}">
          <div class="card card-body bg-light border-0 text-muted" style="font-size: 0.9em; white-space: pre-line;">
            ${project.abstract}
          </div>
        </div>
      ` : '';

      const card = `
        <div class="card shadow-sm border-dark">
          <div class="card-body">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
              <div>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <h5 class="card-title mb-0 fw-bold">${project.title}</h5>
                  <span class="badge bg-${project.badgeColor}">${project.badge}</span>
                </div>
                <p class="card-text text-muted mb-2">${project.description}</p>
                ${authorHtml}
              </div>
              <div class="text-md-end flex-shrink-0 d-flex gap-2 align-items-center">
                ${abstractBtn}
                <a href="${project.link}" target="_blank" class="btn btn-outline-dark btn-sm">
                  ${project.buttonText}
                </a>
              </div>
            </div>
            ${abstractCollapse}
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', card);
    });
  })
  .catch(error => console.error('Error loading JSON:', error));

</script>
</body>
</html>
